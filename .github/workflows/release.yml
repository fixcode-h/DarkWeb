name: Release

# main 分支有新提交时自动构建、验收并发布扩展包
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布说明要对比上一个发布标签，需要完整历史和标签
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Resolve version
        # 版本号 = package.json 的 version + 构建序号（如 0.1.0.42），每出一个包自动递增，
        # 也满足商店“每次上传版本号必须更大”的要求
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version").$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Release notes
        # 列出这个包相对上一个包合并了哪些改动；同一份说明也会放进 zip（CHANGES.md）
        run: node scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" release/notes.md
      - name: Build package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: drak-${{ steps.meta.outputs.version }}
          path: release/drak-${{ steps.meta.outputs.version }}.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" release/drak-${{ steps.meta.outputs.version }}.zip \
            --target "$GITHUB_SHA" \
            --title "Drak ${{ steps.meta.outputs.version }}" \
            --notes-file release/notes.md
      - name: Sync to Chrome Web Store
        # 没配置密钥时脚本会直接跳过；配置方法见 docs/store/README.md
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISH: ${{ vars.CWS_PUBLISH }}
        # 上传不带 key 的商店版
        run: node scripts/cws-publish.mjs release/drak-${{ steps.meta.outputs.version }}-store.zip
