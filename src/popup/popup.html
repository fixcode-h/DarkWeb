<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Drak</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <div class="brand">
      <img src="icons/icon-48.png" alt="" width="26" height="26" />
      <div>
        <div class="brand-name">Drak 暗色模式</div>
        <div class="brand-sub" id="globalState"></div>
      </div>
    </div>
    <label class="switch" title="全局开关（Alt+Shift+A）"><input type="checkbox" id="enabled" /><span></span></label>
  </header>

  <main id="main">
    <section class="card site">
      <div class="site-head">
        <span class="dot" id="dot"></span>
        <span class="host" id="host">—</span>
      </div>
      <div class="status" id="status"></div>
      <div class="note" id="note" hidden><span id="noteText"></span> <button type="button" class="link" id="noteAction" hidden></button></div>
      <div class="seg" id="siteMode" role="radiogroup" aria-label="本站模式">
        <button type="button" role="radio" data-mode="auto" title="按站点规则自动选择（推荐）">自动</button>
        <button type="button" role="radio" data-mode="dynamic" title="按颜色角色重新配色">动态</button>
        <button type="button" role="radio" data-mode="native" title="使用网站自带的暗色主题">原生</button>
        <button type="button" role="radio" data-mode="filter" title="整页滤镜反色，兜底方案">滤镜</button>
        <button type="button" role="radio" data-mode="off" title="本站不启用（Alt+Shift+D）">关闭</button>
      </div>
    </section>

    <section class="card">
      <h2>外观</h2>
      <div id="appearance"></div>
    </section>

    <section class="card">
      <h2>选项</h2>
      <label class="opt">
        <span>白底截图、图表降低亮度</span>
        <span class="switch small"><input type="checkbox" id="dimImages" /><span></span></span>
      </label>
      <label class="opt">
        <span>只在系统为深色时启用</span>
        <span class="switch small"><input type="checkbox" id="followSystem" /><span></span></span>
      </label>
      <label class="opt">
        <span>定时启用</span>
        <span class="switch small"><input type="checkbox" id="scheduleEnabled" /><span></span></span>
      </label>
      <div class="times" id="times" hidden>
        <input type="time" id="scheduleStart" aria-label="开始时间" />
        <span>至</span>
        <input type="time" id="scheduleEnd" aria-label="结束时间" />
        <span class="hint" id="scheduleHint"></span>
      </div>
    </section>

    <section class="card tr" id="trBox">
      <div class="tr-head">
        <h2>网页翻译</h2>
        <button id="trToggle" class="primary" type="button">翻译此页面</button>
      </div>
      <label class="field"><span>目标语言</span><select id="trTarget"></select></label>
      <label class="field"><span>翻译引擎</span><select id="trEngine"></select></label>
      <label class="field">
        <span>显示方式</span>
        <select id="trMode">
          <option value="bilingual">双语对照</option>
          <option value="replace">仅显示译文</option>
        </select>
      </label>
      <label class="opt">
        <span>总是翻译此网站</span>
        <span class="switch small"><input type="checkbox" id="trAuto" /><span></span></span>
      </label>
      <div class="tr-foot">
        <span class="hint" id="trStatus"></span>
        <a href="#" id="trOptions">翻译设置</a>
      </div>
    </section>

    <details id="diagBox">
      <summary>诊断信息</summary>
      <pre id="diag"></pre>
      <button id="copyDiag" type="button">复制诊断信息</button>
    </details>
  </main>

  <footer>
    <span class="hint"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>D</kbd> 开关本站 · <kbd>T</kbd> 翻译</span>
    <a href="#" id="openOptions">规则与设置</a>
  </footer>
  <script src="popup.js"></script>
  <script src="translate-popup.js"></script>
</body>
</html>
